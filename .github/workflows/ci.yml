name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      # El script "lint" existe pero ESLint nunca se configuró en este repo
      # (next lint pide un setup interactivo) — pendiente como su propia tarea.

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
