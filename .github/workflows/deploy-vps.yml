name: Deploy VPS

# Se dispara cuando el workflow "CI" (type-check + tests + build) termina en
# main. Si CI falla, esto ni arranca — nunca se despliega código roto.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/plata/app
            # El working tree del servidor es descartable: nadie debería
            # editar código acá. Un `git pull` aborta si alguien lo hizo
            # (pasó con apps/api/src/routes/deals.ts y frenó el deploy
            # entero), así que se fuerza el estado de origin/main. Lo que
            # se descarta queda registrado en el log de Actions por el
            # `git status` de abajo — se pierde el archivo, no la evidencia.
            echo "── Estado local antes de descartarlo ──"
            git status --short
            git fetch origin
            git reset --hard origin/main
            # -fd borra archivos y directorios sin trackear. Sin -x a
            # propósito: los ignorados sobreviven, y ahí vive deploy/.env
            # con todos los secrets de producción.
            git clean -fd
            cd deploy
            docker compose build
            # Migraciones antes del swap de contenedores: si fallan, el
            # `set -e` corta acá y los contenedores viejos siguen sirviendo
            # con la base intacta. Corre en un contenedor efímero de la
            # imagen recién construida (hereda DATABASE_URL del env_file).
            #
            # Queda una ventana de segundos entre migrar y `up -d` donde el
            # código viejo corre contra el schema nuevo. Es el orden menos
            # malo de los dos — al revés, el código nuevo consulta columnas
            # que todavía no existen y tira 500 en cada request, y un fallo
            # de migración ya no podría abortar el deploy.
            docker compose run --rm -T --no-deps crm-api node dist/db/migrate.js
            docker compose up -d
            docker image prune -f
