name: Deploy VPS

# Se dispara cuando el workflow "CI" (type-check + tests + build) termina en
# main. Si CI falla, esto ni arranca — nunca se despliega código roto.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/plata/app
            git pull
            cd deploy
            docker compose build
            docker compose up -d
            docker image prune -f
