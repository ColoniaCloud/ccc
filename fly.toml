app = "crm-api-cccloud"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT       = "3001"
  NODE_ENV   = "production"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
